# Builds the Windows app and smoke-tests the built .exe files on every pull request.
# Push a tag like v1.1.0 -> the same build and smoke test, then publish it as a GitHub Release.
# The dashboard's "Check for Updates" button reads the latest Release from this repo.
name: Windows app

on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check tag matches server.VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)".*/\1/p' server.py)
          [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != v$version in server.py"; exit 1; }

      - name: Build
        shell: cmd
        run: build_exe.bat

      - name: Size
        shell: bash
        run: |
          du -sh dist/WebsiteCrawler
          ls -l dist/WebsiteCrawler-windows.zip

      # The release is published only if the built app crawls the fixture site and serves the dashboard.
      - name: Smoke test the built app
        run: python tests/smoke_frozen.py dist/WebsiteCrawler

      - uses: actions/upload-artifact@v4
        with:
          name: WebsiteCrawler-windows
          path: dist/WebsiteCrawler-windows.zip
          compression-level: 0
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WebsiteCrawler-windows
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/WebsiteCrawler-windows.zip
          # Shown above the generated change list: which file to take and what to do with it.
          body: |
            **Download `WebsiteCrawler-windows.zip` below** (not "Source code"). Unzip it, open the WebsiteCrawler folder, double-click WebsiteCrawler.exe.

            If Windows SmartScreen says "Windows protected your PC":
            click "More info", then "Run anyway".
            The app is not code-signed yet.

            Already installed? Use Check for Updates in the app.
          generate_release_notes: true
